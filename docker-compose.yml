version: "3.9"

networks:
  distribuidos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  db1:
    image: mariadb:11
    container_name: db1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: distribuidos
      MYSQL_USER: distribuido
      MYSQL_PASSWORD: distribuido
    volumes:
      - db1_data:/var/lib/mysql
    networks:
      - distribuidos-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  db2:
    image: mariadb:11
    container_name: db2
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: distribuidos
      MYSQL_USER: distribuido
      MYSQL_PASSWORD: distribuido
    volumes:
      - db2_data:/var/lib/mysql
    networks:
      - distribuidos-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  server1:
    build: ./server
    container_name: server1
    hostname: server1
    environment:
      SERVER_ID: server1
      DB_HOST: db1
      DB_USER: distribuido
      DB_PASSWORD: distribuido
      DB_NAME: distribuidos
      PEER_HOST: server2
    depends_on:
      db1:
        condition: service_healthy
    expose:
      - "8000"
      - "8765"
    networks:
      distribuidos-net:
        ipv4_address: 192.168.100.10

  server2:
    build: ./server
    container_name: server2
    hostname: server2
    environment:
      SERVER_ID: server2
      DB_HOST: db2
      DB_USER: distribuido
      DB_PASSWORD: distribuido
      DB_NAME: distribuidos
      PEER_HOST: server1
    depends_on:
      db2:
        condition: service_healthy
    expose:
      - "8000"
      - "8765"
    networks:
      distribuidos-net:
        ipv4_address: 192.168.100.20

  nginx:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - server1
      - server2
    networks:
      - distribuidos-net

volumes:
  db1_data:
  db2_data:
