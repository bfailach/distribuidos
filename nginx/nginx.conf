events {
    worker_connections 1024;
}

http {
    upstream backend {
        server server1:8000;
        server server2:8000;
    }

    server {
        listen 80;

        # Cliente web (requisito 1 y 3: registrar y consultar desde un cliente)
        location /ui/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /ui/index.html;
        }

        # Requisito 6: estado de CADA servidor por separado, sin pasar por
        # el balanceador, para poder mostrar a los dos nodos a la vez.
        location /status/server1 {
            proxy_pass http://server1:8000/health;
        }

        location /status/server2 {
            proxy_pass http://server2:8000/health;
        }

        # API balanceada: registro / consulta / health genérico.
        # Nginx reparte round-robin entre server1 y server2 (requisito 2 y 7).
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
